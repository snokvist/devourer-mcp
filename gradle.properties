org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The build targets a JDK 21 toolchain. Gradle auto-detects installations in
# the usual places; JAVA_HOME and DEVOURER_MCP_JDK are consulted too.
#
# If your JDK lives somewhere Gradle does not look, declare it in your USER
# gradle properties rather than here — this file is shared, that one is yours:
#   echo 'org.gradle.java.installations.paths=/path/to/jdk-21' >> ~/.gradle/gradle.properties
org.gradle.java.installations.fromEnv=JAVA_HOME,DEVOURER_MCP_JDK
